name: Build Android APK (External Link)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate Dummy APK File
      run: |
        mkdir -p output
        echo "Telugu Smart Money AI - Application Package" > output/TeluguSmartMoneyAI.apk

    - name: Upload APK to External Storage & Get Download Link
      run: |
        echo "================================================="
        echo "Uploading APK to free external hosting..."
        # GitHub Storage వాడకుండా బాహ్య సర్వర్‌కి పంపి డౌన్‌లోడ్ లింక్ పొందడం
        DOWNLOAD_URL=$(curl -s -F "file=@output/TeluguSmartMoneyAI.apk" https://bashupload.com | grep -o 'https://bashupload.com/[^"]*')
        echo "================================================="
        echo "YOUR APK DOWNLOAD LINK:"
        echo "$DOWNLOAD_URL"
        echo "================================================="
        
