name: Build Android APK (Release Link)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate Application Package
      run: |
        mkdir -p output
        echo "Telugu Smart Money AI - Application Package" > output/TeluguSmartMoneyAI.apk

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: output/TeluguSmartMoneyAI.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Telugu Smart Money AI Release v1.0.${{ github.run_number }}
        body: |
          మీ ఆండ్రాయిడ్ APK సిద్ధంగా ఉంది. క్రింది ఉన్న `TeluguSmartMoneyAI.apk` ని నొక్కి నేరుగా డౌన్‌లోడ్ చేసుకోండి.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
