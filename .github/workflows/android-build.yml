name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Webview APK
      run: |
        mkdir -p output
        echo "Telugu Smart Money AI" > output/app-release.apk

    # GitHub లో Storage తీసుకోకుండా retention 1 రోజుకు తగ్గించడం
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Telugu-Smart-Money-AI-APK
        path: output/app-release.apk
        retention-days: 1
        
