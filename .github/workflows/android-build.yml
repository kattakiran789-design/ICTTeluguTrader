name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # అదనంగా మాన్యువల్‌గా రన్ చేయడానికి ఆప్షన్

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # మీ ప్రాజెక్ట్ Flutter అయితే ఈ స్టెప్ వాడండి (Android Native అయితే కామెంట్/డిలీట్ చేయండి)
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    # Storage Quota సమస్య రాకుండా retention-days: 1 జోడించబడింది
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk # Native Android ఐతే: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 1 # 1 రోజు తర్వాత స్టోరేజ్ ఆటోమేటిక్‌గా ఖాళీ అవుతుంది
        compression-level: 9 # ఫైల్ సైజు తగ్గించి అప్‌లోడ్ చేస్తుంది
        
